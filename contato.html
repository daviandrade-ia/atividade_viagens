<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trilhas do Mundo - Expedições</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
</head>
<body>
        <header class="cabecalho">
        <div class="logo">
            <i class="fa-solid fa-earth-americas"></i>
            <span>Trilhas do Mundo</span>
        </div>
        <div class="navegacao">
            <div class="menu-links">
                <nav class="menu">
                    <a href="index.html">Início</a>
                    <a href="destinos.html">Destinos</a>
                    <a href="sobre.html">Sobre</a>
                    <a href="">Contato</a>
                </nav>
            </div>
            <div class="redes">
                <a href="" class="whatsapp"><i class="fa-brands fa-whatsapp"></i></a>
                <a href="" class="facebook"><i class="fa-brands fa-square-facebook"></i></a>
                <a href="" class="instagram"><i class="fa-brands fa-instagram"></i></a>
                <a href="" class="x"><i class="fa-brands fa-x-twitter"></i></a>
            </div>
        </div>
    </header>
    <section class="banner">
        <img src="https://images.pexels.com/photos/14757444/pexels-photo-14757444.jpeg" alt="Imagem com floresta, montanha e nuvem." class="img"> 
        <main class="contato">
            <h1 class="titulo">Faça Contato Conosco</h1>
            <form action="/processar cadastro" method="post" class="coluna-form">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu Nome" required minlength="3" maxlength="50"><br>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="exemplo@dominio.com" required><br>
                <label for="assunto">Assunto Alternativo</label>
                <input type="assun" id="assun" name="assun" placeholder="Assunto Alternativo" required><br>
                <button type="submit" class="btn-enviar">Enviar</button>
                <button type="reset" class="btn-limpar">Limpar Tudo</button>
            </form>
        </main>
    </section>
    <footer class="rodape">

        <p>
            © 2026 Explore o Mundo. Todos os Direitos Reservados
        </p>

    </footer>
</body>
</html>
